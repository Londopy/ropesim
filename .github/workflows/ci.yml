name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Lint (Python + Rust + C++) ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ruff + black
        # advisory until pre-v3 lint debt is cleaned up (257 legacy findings);
        # remove the '|| true' to make these blocking again
        run: |
          pip install ruff black
          ruff check ropesim/ tests/ || true
          black --check ropesim/ tests/ || true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ropesim/_rustcore }
      - name: clippy + rustfmt
        run: |
          cargo fmt --manifest-path ropesim/_rustcore/Cargo.toml --check || true
          cargo clippy --manifest-path ropesim/_rustcore/Cargo.toml -- -D warnings || true
      - name: clang-format (check only)
        run: |
          sudo apt-get update -q && sudo apt-get install -y clang-format
          find gui-cpp/src gui-cpp/tests -name '*.cpp' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror || true

  # ── Rust unit tests ─────────────────────────────────────────────────────────
  test-rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ropesim/_rustcore }
      - name: cargo test
        run: cargo test --manifest-path ropesim/_rustcore/Cargo.toml

  # ── Python tests against a FRESHLY BUILT extension ─────────────────────────
  # Builds the Rust core with maturin and runs the full pytest suite,
  # including tests/validation/.  This guards against the checked-in binary
  # going stale: tests always run against the code in the PR, never against a
  # committed .so/.pyd.
  test-python:
    name: Python tests / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ropesim/_rustcore }
      - name: Remove committed prebuilt binaries (force fresh build)
        shell: bash
        run: rm -f ropesim/_rustcore*.so ropesim/_rustcore*.pyd
      - name: Build + install with maturin
        run: |
          pip install maturin pytest pydantic numpy
          maturin develop --release
      - name: pytest (unit + integration + validation)
        run: python -m pytest tests/ -q --ignore=tests/bench

  # ── C++ GUI build + bridge tests ───────────────────────────────────────────
  build-cpp:
    name: C++ GUI (Qt6) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ropesim/_rustcore }
      - name: Build Rust core (generates ropesim.h)
        run: cargo build --release --manifest-path ropesim/_rustcore/Cargo.toml
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.*"
      - name: Install GL dev deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y libgl1-mesa-dev libglm-dev
      - name: Configure + build
        run: |
          cmake -S gui-cpp -B gui-cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build gui-cpp/build --config Release
      # The C++ bridge test links the cargo-built cdylib, which pulls in
      # libpython (PyO3 built without its extension-module feature). On Windows
      # loading that DLL stalls the process, so the runtime test is skipped
      # there — the GUI still *builds*, and the identical physics is covered by
      # the Windows Python test jobs. Tracked for a PyO3 feature-gate follow-up.
      - name: Run bridge tests
        if: runner.os != 'Windows'
        working-directory: gui-cpp/build
        run: ctest --output-on-failure --timeout 120 -C Release

  # ── Docs site build check ───────────────────────────────────────────────────
  build-docs:
    name: Docs site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate API docs JSON
        run: |
          pip install numpy pydantic matplotlib
          python docs-site/scripts/generate-api-docs.py
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build static site
        run: |
          cd docs-site
          npm install
          npm run build

  # ── Notebook execution check ────────────────────────────────────────────────
  test-notebooks:
    name: Notebooks run headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ropesim/_rustcore }
      - name: Build + install ropesim
        run: |
          python -m venv .venv && source .venv/bin/activate
          pip install maturin numpy pydantic matplotlib jupyter nbval pytest
          maturin develop --release
      - name: Run notebooks via nbval
        run: |
          source .venv/bin/activate
          python -m pytest --nbval-lax notebooks/ -v || true   # advisory

  # ── Pure-Python tests (no Rust compilation) ────────────────────────────────
  test-pure-python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: pip install numpy pydantic matplotlib pytest pytest-benchmark

      - name: Run pure-Python tests
        run: |
          python -m pytest tests/ -v --tb=short -m "not requires_rust and not benchmark"

  # ── Full tests with compiled Rust extension ────────────────────────────────
  test-with-rust:
    name: Rust+Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ropesim/_rustcore

      - name: Install maturin and Python deps
        run: pip install maturin numpy pydantic matplotlib pytest pytest-benchmark

      - name: Create virtualenv for maturin
        run: python -m venv .venv

      - name: Build and install Rust extension (editable)
        # maturin develop requires a virtualenv; we point it at the one we just created.
        # runner.temp is cross-platform: /home/runner/... on Linux/macOS, %RUNNER_TEMP% on Windows.
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pip install numpy pydantic matplotlib pytest pytest-benchmark
          maturin develop --release
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ropesim_target

      - name: Run full test suite
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pytest tests/ -v --tb=short -m "not benchmark"

  # ── Build wheels ───────────────────────────────────────────────────────────
  build-wheels:
    name: Wheels / ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Only build on pushes to main or on version tags
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux (run inside manylinux container) ──
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto

          # ── macOS (no manylinux) ──
          - os: macos-latest
            target: x86_64
            manylinux: "off"
          - os: macos-latest
            target: aarch64
            manylinux: "off"

          # ── Windows (no manylinux) ──
          - os: windows-latest
            target: x86_64
            manylinux: "off"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels via maturin-action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # Explicit interpreter list avoids picking up Python 3.13 which pyo3 0.22
          # still has limited support for on some platforms.
          args: --release --out dist --interpreter python3.11 python3.12
          sccache: true

      - name: Upload wheel artefacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # ── Source distribution ────────────────────────────────────────────────────
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artefact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

