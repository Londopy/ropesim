# cbindgen configuration — generates gui-cpp/include/ropesim.h
# from ropesim/_rustcore/src/ffi.rs.  Run automatically by build.rs.

language = "C"
include_guard = "ROPESIM_H"
autogen_warning = "/* AUTO-GENERATED by cbindgen — do not edit */"
tab_width = 4
documentation = true
documentation_style = "c99"
cpp_compat = true

[export]
# Only export the C ABI surface; ignore PyO3/rapier internals.
include = []
exclude = []
prefix = ""

[export.rename]
"KnotType" = "RopesimKnotType"
"RockType" = "RopesimRockType"
"SheathRating" = "RopesimSheathRating"
"ClimbingStyle" = "RopesimClimbingStyle"
"BelayDevice" = "RopesimBelayDevice"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
include = ["ropesim-rustcore"]

[fn]
sort_by = "None"
